name: camofox-build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish package to the bionic-latest release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: camofox-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Restore camoufox build caches
        uses: actions/cache@v4
        with:
          path: |
            camofox-cache/ccache
          key: camofox-build-v1-${{ hashFiles('camofox/**') }}
          restore-keys: |
            camofox-build-v1-

      - name: configure + build Camoufox for Termux (Bionic)
        env:
          CAMOFOX_PIN: "6f74fa06df586b8dce7a86c6d2b35a1c13b498b2"
          TERMUX_PKGS_PIN: "e462d86688f194debff9073440b3b6b72a7a35ae"
          CAMOFOX_BUILD: "1"
        run: |
          set -o pipefail
          mkdir -p camofox-out-cfg && chmod 0777 camofox-out-cfg
          mkdir -p camofox-cache/ccache && chmod -R 777 camofox-cache
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$GITHUB_WORKSPACE/camofox-out-cfg:/out" \
            -v "$GITHUB_WORKSPACE/camofox-cache:/ci-cache" \
            -w /work \
            termux/termux-docker:aarch64 \
            bash -c 'export CAMOFOX_PIN="$1" TERMUX_PKGS_PIN="$2" CAMOFOX_BUILD="$3"; shift 3; exec bash /work/camofox/configure.sh' \
            _ "$CAMOFOX_PIN" "$TERMUX_PKGS_PIN" "$CAMOFOX_BUILD"

      - name: Upload deb artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camoufox-deb
          path: camofox-out-cfg/*.deb*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload pacman artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camoufox-pacman
          path: camofox-out-cfg/*.pkg.tar.xz*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload zip artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camoufox-zip
          path: camofox-out-cfg/*.zip*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload tree tar artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camoufox-tree-tar
          path: camofox-out-cfg/*.tar*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camofox-build-logs
          path: camofox-out-cfg/*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish to bionic-latest release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Rolling "latest" release: clobber-upload keeps storage constant.
          if gh release view bionic-latest >/dev/null 2>&1; then
            gh release upload bionic-latest camofox-out-cfg/camoufox-*.tar* camofox-out-cfg/camoufox-*.deb* camofox-out-cfg/camoufox-*.zip* --clobber
          else
            gh release create bionic-latest \
              --title "Camoufox — Bionic native (rolling latest)" \
              --notes "Native Bionic build for Termux aarch64. Formats: tar.xz tree, .deb (pkg/apt), pacman .pkg.tar.xz, zip. Verify with .sha256 sidecars; install guide in docs/INSTALL.md." \
              camofox-out-cfg/camoufox-*.tar.xz camofox-out-cfg/camoufox-*.tar.* camofox-out-cfg/camoufox-*.deb camofox-out-cfg/camoufox-*.zip camofox-out-cfg/camoufox-*.sha256
          fi
