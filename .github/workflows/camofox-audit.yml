name: camofox-audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Patch-apply audit (camoufox 158.0.1 + termux firefox patches)
        env:
          CAMOFOX_PIN: "340cf16170eaca627711b9dbdd541dbe516b895f"   # daijro/camoufox v159.0-beta.42
          TERMUX_PKGS_PIN: "a179df88745ead5edd48cea6e95bee47563d2919" # x11/firefox 159.0.1 patch era
        run: |
          set -o pipefail
          bash camofox/audit-on-runner.sh 2>&1 | tee camofox-audit.log

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camofox-patch-audit
          path: |
            camofox-out/
            camofox-audit.log
          if-no-files-found: error
          retention-days: 30
