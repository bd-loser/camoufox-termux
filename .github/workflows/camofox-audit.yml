name: camofox-audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Patch-apply audit (camoufox 158.0.1 + termux firefox patches)
        env:
          CAMOFOX_PIN: "c3ad3bf2c3c6e93225aa6587246c8b70f9314664"   # daijro/camoufox v158.0.1-beta.41
          TERMUX_PKGS_PIN: "7f64c407e01310bb85c25818d7966a878653a7d6" # x11/firefox 158.0.1 patch era
        run: |
          set -o pipefail
          bash camofox/audit-on-runner.sh 2>&1 | tee camofox-audit.log

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camofox-patch-audit
          path: |
            camofox-out/
            camofox-audit.log
          if-no-files-found: error
          retention-days: 30
