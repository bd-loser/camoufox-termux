name: camofox-audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Patch-apply audit (camoufox 158 + termux firefox patches)
        env:
          CAMOFOX_PIN: "c9ed439d49948cc8e4335aee6bea1a7b23dc4d2d"   # daijro/camoufox v158.0-beta.40
          TERMUX_PKGS_PIN: "e2b25a170e34052eb30fdb64da0593bc69499ca9" # Firefox 158 patch era + 0031 ioprio-on-android
        run: |
          set -o pipefail
          bash camofox/audit-on-runner.sh 2>&1 | tee camofox-audit.log

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camofox-patch-audit
          path: |
            camofox-out/
            camofox-audit.log
          if-no-files-found: error
          retention-days: 30
